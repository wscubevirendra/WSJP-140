<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        header {
            width: 100%;
            padding: 20px;
            background-color: #111;
            color: white;
            display: flex;
            justify-content: space-between;
        }

        .search-container {
            display: flex;
            gap: 20px;
        }

        .search-container input {
            width: 280px;
            padding: 8px;
            border-radius: 6px;
            outline: none;
            border: none;
        }

        .search-container button {
            padding: 4px 20px;
            background-color: red;
            color: white;
            border: none;
            border-radius: 6px;
        }

        header h4 {
            font-size: 25px;
        }

        main {
            width: 1200px;
            margin: auto;
            padding: 10px;
            margin-top: 10px;
        }

        .movieContainer {
            width: 1200px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin: 20px auto;

        }

        .skeleton {
            background: white;
            border-radius: 10px;
            overflow: hidden;
        }

        .skeleton-img {
            height: 350px;
            background: linear-gradient(90deg,
                    #eeeeee 25%,
                    #dddddd 50%,
                    #eeeeee 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
        }

        .skeleton-content {
            padding: 15px;
        }

        .skeleton-title {
            height: 20px;
            width: 80%;
            margin-bottom: 10px;
            border-radius: 5px;
            background: #eeeeee;
        }

        .skeleton-text {
            height: 15px;
            width: 50%;
            border-radius: 5px;
            background: #eeeeee;
        }

        @keyframes loading {
            0% {
                background-position: 200% 0;
            }

            100% {
                background-position: -200% 0;
            }
        }

        .movie-card {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
        }

        .movie-card img {
            width: 100%;
            height: 350px;
            object-fit: cover;
            display: block;
        }

        .movie-info {
            padding: 15px;
        }

        .movie-info h3 {
            margin-bottom: 8px;
            font-size: 18px;
        }

        .movie-info p {
            color: #666;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <header>
        <h4>Movie App</h4>
        <div class="search-container">
            <input type="text">
            <button>Search</button>
        </div>

    </header>
    <main class="containter">
        <h2>Popular Movies</h2>
        <div class="movieContainer">

        </div>
    </main>



    <script>
        const APIURL =
            "https://api.themoviedb.org/3/discover/movie?sort_by=popularity.desc&api_key=04c35731a5ee918f014970082a0088b1&page=1";

        const IMGPATH =
            "https://image.tmdb.org/t/p/w1280";

        const SEARCHAPI =
            "https://api.themoviedb.org/3/search/movie?api_key=04c35731a5ee918f014970082a0088b1&query=";
        const movieContainer = document.querySelector(".movieContainer");
        const button = document.querySelector(".search-container button");
        const input = document.querySelector(".search-container input");

        function skeleton() {
            movieContainer.innerHTML = "";
            for (let i = 1; i <= 9; i++) {
                movieContainer.innerHTML += ` <div class="skeleton">
                <div class="skeleton-img"></div>
                <div class="skeleton-content">
                    <div class="skeleton-title"></div>
                    <div class="skeleton-text"></div>
                </div>
            </div>`

            }
        }

        function showMovies(movies) {
            movieContainer.innerHTML = "";
            if (movies.length == 0){
                return movieContainer.innerHTML="<h3>Not Movies Found</h3>"
            }
                movies.forEach((movie, index) => {
                    const { title, poster_path, release_date, vote_average } = movie;
                    const card = document.createElement("div");
                    card.classList.add("movie-card");
                    card.innerHTML = ` <img src=${IMGPATH + poster_path} alt="">
                <div class="movie-info">
                    <h3>${title} </h3>
                    <p>Release Date:${release_date}</p>
                    <p>Rating:${vote_average}</p>
                </div>`
                    movieContainer.append(card)
                });
        }

        function showError() {
            movieContainer.innerHTML = "";
            movieContainer.innerHTML = `<p>Something went wrong</p>`
        }


        async function loadPopularMovies() {
            try {
                skeleton()
                const response = await fetch(APIURL);
                if (!response.ok) {
                    throw new Error("Someting went wrong")
                }
                const data = await response.json();
                showMovies(data.results)

            } catch (error) {
                console.log(error)
                showError()
            }
        }

        loadPopularMovies()


        button.addEventListener("click", async () => {
            const query = input.value.trim();
            if (query == "") {
                return loadPopularMovies();
            }

            try {
                skeleton()
                const response = await fetch(SEARCHAPI + query);
                if (!response.ok) {
                    throw new Error("Someting went wrong")
                }
                const data = await response.json();
                showMovies(data.results)

            } catch (error) {
                console.log(error)
                showError()
            }
        })
    </script>
</body>

</html>
