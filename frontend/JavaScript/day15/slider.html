<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        .container {
            width: 800px;
            height: 400px;
            box-shadow: 0px 1px 1px gray;
            margin: 50px auto;
            display: flex;
            padding: 10px;
            gap: 50px;
            overflow: hidden;
        }

        .button_container {

            display: flex;
            gap: 20px;
            justify-content: center;
        }

        button {
            padding: 4px 14px;
            border: none;
            outline: none;
            background-color: black;
            color: white;
            cursor: pointer;
        }

        .card {
            width: 50%;
            height: 100%;
            flex-shrink: 0;
            transform: translateX(0);
            transition: 600ms;
        }

        .card img {
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="card"><img src="https://picsum.photos/id/236/1000/500" alt=""></div>
        <div class="card"><img src="https://picsum.photos/id/237/1000/500" alt=""></div>
        <div class="card"><img src="https://picsum.photos/id/238/1000/500" alt=""></div>
        <div class="card"><img src="https://picsum.photos/id/239/1000/500" alt=""></div>
        <div class="card"><img src="https://picsum.photos/id/240/1000/500" alt=""></div>

    </div>
    <div class="button_container">
        <button onclick="prevSlide()">Prev</button>
        <button onclick="nextSlide()">Next</button>
    </div>
    <script>
        const cards = document.querySelectorAll(".card");
        let count = 0

        function nextSlide() {
            count++
            if (count > cards.length - 1) {
                count = 0
            }

            for (const box of cards) {
                box.style.transform = `translateX(-${count * 200}%)`
            }
        }

        function prevSlide() {
            count--
            if (count === 0) {
                count=0
            }
            for (const box of cards) {
                box.style.transform = `translateX(-${count * 100}%)`
            }
        }

    </script>

</body>

</html>
