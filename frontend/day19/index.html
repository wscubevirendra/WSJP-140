    <!DOCTYPE html>
    <html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>4x4 L Shape Grid</title>

        <script src="https://cdn.tailwindcss.com"></script>
    </head>

    <body class="min-h-screen flex items-center justify-center bg-gray-100">

        <div class="grid grid-cols-4 grid-rows-4 gap-1 w-80 h-80">

            <!-- Vertical part of L -->
            <div class="col-start-1 row-start-1 row-span-4 bg-blue-500"></div>

            <!-- Horizontal part of L -->
            <div class="col-start-2 col-span-3 row-start-4 bg-blue-500"></div>

        </div>

    </body>
