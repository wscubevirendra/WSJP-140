
<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document</title>
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        .container{
            width: 1000px;
            height: 400px;
            border: 2px solid red;
            margin: auto;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-evenly;
            align-items: center;
        }

        .card{
            width: 250px;
            height: 150px;
            border: 2px solid green;
            font-size: 50px;
            border-radius: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
     
           

        }
        .box{
            width: 20px;
            height: 20px;
            border: 4px solid green;
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="box"></div>
        </div>
        <div class="card">2</div>
        <div class="card">3</div>
        <div class="card">4</div>
        <div class="card">5</div>
        <div class="card">6</div>
       

    </div>
    
</body>
</html>
